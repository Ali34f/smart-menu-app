services:
  mongo:
    image: mongo:7
    container_name: smart-menu-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-menu-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "0.0.0.0:5002:5002"
    environment:
      NODE_ENV: development
      PORT: 5002
      CLIENT_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
    # MONGODB_URI and JWT_SECRET come from backend/.env (e.g. your Atlas URI)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: smart-menu-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:80"     
    depends_on:
      - backend

volumes:
  mongo_data:
