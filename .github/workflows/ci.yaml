name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Backend tests
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test

      - name: Frontend tests
        run: |
          cd frontend
          npm test -- --watchAll=false
        env:
          CI: true

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          CI: false

      - name: Docker build check
        run: |
          docker build -t smart-menu-backend:test ./backend
          docker build -t smart-menu-frontend:test ./frontend
