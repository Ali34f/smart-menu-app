server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React app
  location / {
    try_files $uri /index.html;
  }

  # Proxy API requests to backend (use service name so Docker resolves it)
  location /api/ {
    proxy_pass http://backend:5002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy uploads (menu images) to backend
  location /uploads/ {
    proxy_pass http://backend:5002/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Static assets from React build
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
